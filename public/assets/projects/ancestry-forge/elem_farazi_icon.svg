<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Heritage Tree Emblem -->
  <g transform="translate(256, 256)">
    <!-- Root / Trunk -->
    <path d="M -16 140 Q 0 80 0 0 Q 0 80 16 140 Z" fill="url(#gold)"/>
    <circle cx="0" cy="145" r="16" fill="url(#gold)"/>

    <!-- Central Node -->
    <circle cx="0" cy="0" r="28" fill="url(#cyan)"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>

    <!-- Left Branch -->
    <path d="M 0 0 C -60 -40 -100 -20 -130 -80" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-130" cy="-80" r="22" fill="url(#gold)"/>

    <!-- Right Branch -->
    <path d="M 0 0 C 60 -40 100 -20 130 -80" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="130" cy="-80" r="22" fill="url(#gold)"/>

    <!-- Top Branch -->
    <path d="M 0 0 L 0 -120" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-120" r="24" fill="url(#cyan)"/>

    <!-- Sub Branches -->
    <path d="M -130 -80 C -150 -130 -160 -150 -180 -160" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-180" cy="-160" r="14" fill="#fcd34d"/>

    <path d="M -130 -80 C -100 -120 -80 -140 -70 -160" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-70" cy="-160" r="14" fill="#fcd34d"/>

    <path d="M 130 -80 C 100 -120 80 -140 70 -160" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="70" cy="-160" r="14" fill="#fcd34d"/>

    <path d="M 130 -80 C 150 -130 160 -150 180 -160" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="180" cy="-160" r="14" fill="#fcd34d"/>
  </g>
</svg>
